name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev pkg-config clang

      - name: Test
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  package-macos:
    name: Package macOS
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Install nsh
        run: |
          curl --retry 3 -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Package
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          nsh package --target macos --arch universal --icon assets/icon.png \
            --app-version "$version" --build "$GITHUB_RUN_NUMBER" -o dist
          app="$(find dist -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/sessiontree-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sessiontree-macos-universal
          path: dist/sessiontree-macos-universal.zip
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: Package Linux
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev pkg-config clang
      - name: Install nsh
        run: |
          curl --retry 3 -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Package
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          nsh package --target linux --icon assets/icon.png \
            --app-version "$version" --build "$GITHUB_RUN_NUMBER" -o dist
          tarball="$(find dist -maxdepth 1 -name '*.tar.gz' -type f | head -1)"
          if [ -n "$tarball" ]; then
            mv "$tarball" dist/sessiontree-linux-x86_64.tar.gz
          else
            appdir="$(find dist -mindepth 1 -maxdepth 1 -type d | head -1)"
            test -n "$appdir"
            tar -czf dist/sessiontree-linux-x86_64.tar.gz -C dist "$(basename "$appdir")"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sessiontree-linux-x86_64
          path: dist/sessiontree-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  package-windows:
    name: Package Windows
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Install nsh
        shell: pwsh
        run: irm https://nsh.dev/install.ps1 | iex
      - name: Package
        shell: pwsh
        run: |
          $nsh = Join-Path $env:LOCALAPPDATA 'nsh\bin\nsh.exe'
          if (-not (Test-Path $nsh)) { throw "nsh not found at $nsh" }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches.Groups[1].Value
          & $nsh package --target windows --icon assets/icon.png --app-version $version --build $env:GITHUB_RUN_NUMBER -o dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem -Path dist -Filter *.zip -File | Select-Object -First 1
          if ($zip) {
            Move-Item -Force $zip.FullName dist\sessiontree-windows-x86_64.zip
          } else {
            $dir = Get-ChildItem -Path dist -Directory | Select-Object -First 1
            if (-not $dir) { throw 'nsh package produced no output' }
            Compress-Archive -Path $dir.FullName -DestinationPath dist\sessiontree-windows-x86_64.zip -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: sessiontree-windows-x86_64
          path: dist/sessiontree-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
