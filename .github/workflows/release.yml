name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NSH_VERSION: v0.6.0

jobs:
  macos:
    name: Package macOS (universal)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install nsh
        run: |
          curl --retry 3 -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Package
        run: |
          nsh --version
          version="${GITHUB_REF_NAME#v}"
          nsh package --target macos --arch universal \
            --icon assets/icon.png \
            --app-version "$version" --build "$GITHUB_RUN_NUMBER" \
            -o dist
          app="$(find dist -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/sessiontree-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/sessiontree-macos-universal.zip
          if-no-files-found: error

  linux:
    name: Package Linux (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libglib2.0-dev pkg-config clang

      - name: Install nsh
        run: |
          curl --retry 3 -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Package
        run: |
          nsh --version
          version="${GITHUB_REF_NAME#v}"
          nsh package --target linux \
            --icon assets/icon.png \
            --app-version "$version" --build "$GITHUB_RUN_NUMBER" \
            -o dist
          tarball="$(find dist -maxdepth 1 -name '*.tar.gz' -type f | head -1)"
          if [ -n "$tarball" ]; then
            mv "$tarball" dist/sessiontree-linux-x86_64.tar.gz
          else
            appdir="$(find dist -mindepth 1 -maxdepth 1 -type d | head -1)"
            test -n "$appdir"
            tar -czf dist/sessiontree-linux-x86_64.tar.gz -C dist "$(basename "$appdir")"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/sessiontree-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Package Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install nsh
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex

      - name: Package
        shell: pwsh
        run: |
          $nsh = Join-Path $env:LOCALAPPDATA 'nsh\bin\nsh.exe'
          if (-not (Test-Path $nsh)) { throw "nsh not found at $nsh" }
          & $nsh --version
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & $nsh package --target windows --icon assets/icon.png --app-version $version --build $env:GITHUB_RUN_NUMBER -o dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem -Path dist -Filter *.zip -File | Select-Object -First 1
          if ($zip) {
            Move-Item -Force $zip.FullName dist\sessiontree-windows-x86_64.zip
          } else {
            $dir = Get-ChildItem -Path dist -Directory | Select-Object -First 1
            if (-not $dir) { throw 'nsh package produced no output' }
            Compress-Archive -Path $dir.FullName -DestinationPath dist\sessiontree-windows-x86_64.zip -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/sessiontree-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * | sort -k2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: Sessiontree ${{ github.ref_name }}
          body: |
            Native session explorer for AI coding agents: Claude Code, Codex, Cursor, Copilot,
            OpenCode, Pi, DeepSeek Harness, ZCode, MiMo Code, Antigravity and Kiro.

            ## Downloads

            | Platform | File | Requirements |
            | --- | --- | --- |
            | macOS (Apple silicon + Intel) | `sessiontree-macos-universal.zip` | macOS 14 or later |
            | Linux (x86_64) | `sessiontree-linux-x86_64.tar.gz` | GTK 4.14+, glibc 2.39+ (Ubuntu 24.04 or later) |
            | Windows (x86_64) | `sessiontree-windows-x86_64.zip` | Windows 10 1809 or later |

            The macOS app is ad hoc signed and not notarized. If macOS quarantines it, open it once
            with right-click → Open, or run `xattr -dr com.apple.quarantine Sessiontree.app`.

            Verify downloads against `SHA256SUMS.txt`.
          files: |
            artifacts/sessiontree-macos-universal.zip
            artifacts/sessiontree-linux-x86_64.tar.gz
            artifacts/sessiontree-windows-x86_64.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
